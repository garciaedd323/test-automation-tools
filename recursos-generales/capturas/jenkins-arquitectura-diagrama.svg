<svg width="680" height="240" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitectura de GitHub Actions vs Jenkins</title>
<desc>Diagrama que compara la arquitectura efímera de GitHub Actions, que provee un runner desechable sin infraestructura propia que mantener, contra la arquitectura de Jenkins, que requiere un Controller propio coordinando Agents persistentes, ambos bajo la responsabilidad del equipo.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="240" fill="#ffffff"/>

<text x="150" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5F5E5A">GitHub Actions</text>
<text x="530" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5F5E5A">Jenkins</text>

<g>
  <rect x="50" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="150" y="58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Runner efímero</text>
  <text x="150" y="76" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Fábrica rentada, desechable</text>
</g>

<rect x="420" y="40" width="220" height="180" rx="12" fill="none" stroke="#9c9a94" stroke-width="1" stroke-dasharray="4 4"/>

<g>
  <rect x="440" y="60" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="530" y="78" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Controller</text>
  <text x="530" y="96" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">El gerente de la fábrica</text>
</g>

<line x1="530" y1="116" x2="530" y2="144" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="440" y="146" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="530" y="164" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">Agent</text>
  <text x="530" y="182" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Fábrica propia, persistente</text>
</g>
</svg>

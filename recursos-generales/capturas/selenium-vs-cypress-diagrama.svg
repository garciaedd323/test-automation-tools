<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fortalezas distintivas de Selenium vs Cypress</title>
<desc>Diagrama que agrupa las fortalezas de Selenium (multi-navegador real, multi-lenguaje, testing mobile con Appium, ecosistema maduro) frente a las fortalezas de Cypress (velocidad, intercept nativo, setup en minutos, un solo lenguaje), como guía rápida de cuándo elegir cada herramienta.</desc>

<rect x="0" y="0" width="680" height="400" fill="#ffffff"/>

<text x="170" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5F5E5A">Elegir Selenium si...</text>
<text x="510" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5F5E5A">Elegir Cypress si...</text>

<rect x="50" y="46" width="240" height="320" rx="12" fill="none" stroke="#9c9a94" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="390" y="46" width="240" height="320" rx="12" fill="none" stroke="#9c9a94" stroke-width="1" stroke-dasharray="4 4"/>

<g>
  <rect x="70" y="66" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="170" y="84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">Multi-navegador real</text>
  <text x="170" y="102" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Safari, navegadores legacy</text>
</g>

<g>
  <rect x="70" y="150" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="170" y="168" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">Multi-lenguaje</text>
  <text x="170" y="186" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Java, Python, C#, JS...</text>
</g>

<g>
  <rect x="70" y="234" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="170" y="252" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">Testing mobile</text>
  <text x="170" y="270" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Extensión natural con Appium</text>
</g>

<g>
  <rect x="70" y="318" width="200" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="170" y="338" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#0C447C">Ecosistema maduro (20+ años)</text>
</g>

<g>
  <rect x="410" y="66" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="510" y="84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Velocidad</text>
  <text x="510" y="102" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Sin latencia de red por comando</text>
</g>

<g>
  <rect x="410" y="150" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="510" y="168" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">cy.intercept nativo</text>
  <text x="510" y="186" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Mock y espía de red integrado</text>
</g>

<g>
  <rect x="410" y="234" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="510" y="252" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Setup en minutos</text>
  <text x="510" y="270" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">npm install y listo</text>
</g>

<g>
  <rect x="410" y="318" width="200" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="510" y="338" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041">Un solo lenguaje (JS/TS)</text>
</g>
</svg>

<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Anatomía de un workflow de GitHub Actions</title>
<desc>Diagrama que muestra cómo el trigger (on) dispara un job en una máquina desechable (runs-on), que ejecuta sus steps en orden trayendo el código, preparando herramientas y cacheando dependencias, antes de correr los tests y subir el reporte como artifact.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="460" fill="#ffffff"/>

<line x1="340" y1="76" x2="340" y2="114" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="170" x2="340" y2="208" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="264" x2="340" y2="302" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="358" x2="340" y2="396" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="240" y="20" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">on: push / PR</text>
  <text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">El trigger</text>
</g>

<g>
  <rect x="240" y="114" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="132" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">runs-on: ubuntu-latest</text>
  <text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Máquina desechable</text>
</g>

<g>
  <rect x="240" y="208" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="226" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#0C447C">steps: checkout, setup, cache</text>
  <text x="340" y="244" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Preparar el terreno</text>
</g>

<g>
  <rect x="240" y="302" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="320" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">run tests (matrix)</text>
  <text x="340" y="338" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">El trabajo real</text>
</g>

<g>
  <rect x="240" y="396" width="200" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="418" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">upload-artifact</text>
</g>
</svg>

<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Anatomía de un test en Playwright</title>
<desc>Diagrama que muestra cómo test.describe() agrupa el bloque, y por cada test se crea automáticamente una fixture page aislada, se ejecuta el test con sus test.step() opcionales, y el contexto se destruye solo al terminar.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="330" fill="#ffffff"/>

<line x1="340" y1="64" x2="340" y2="102" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="186" x2="340" y2="214" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="270" x2="340" y2="298" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="240" y="10" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="32" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">test.describe()</text>
</g>

<rect x="150" y="102" width="380" height="196" rx="12" fill="none" stroke="#9c9a94" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Se repite por cada test</text>

<g>
  <rect x="240" y="130" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Fixture page</text>
  <text x="340" y="166" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Nueva, aislada, automática</text>
</g>

<g>
  <rect x="240" y="214" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="232" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">test(page)</text>
  <text x="340" y="250" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Con test.step() opcionales</text>
</g>

<g>
  <rect x="240" y="298" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="320" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#0C447C">Contexto se destruye solo</text>
</g>
</svg>

<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Flujo de diagnóstico ante un timeout de locator en Playwright</title>
<desc>Diagrama que muestra el camino recomendado de debugging: partir del timeout, revisar la evidencia (reporte HTML, page snapshot, modo debug) antes de sospechar del locator, y llegar a la causa raíz en vez de cambiar código a ciegas.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="700" height="360" fill="#ffffff"/>

<g>
  <rect x="250" y="16" width="200" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="350" y="34" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#4A1B0C">Timeout de locator</text>
  <text x="350" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#993C1D">"waiting for getByRole(...)"</text>
</g>

<line x1="350" y1="64" x2="350" y2="92" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="220" y="94" width="260" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="350" y="117" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">¿La URL carga a mano, fuera de Playwright?</text>
</g>

<line x1="280" y1="140" x2="150" y2="176" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="185" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">No</text>

<line x1="420" y1="140" x2="550" y2="176" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="515" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">Sí</text>

<g>
  <rect x="30" y="178" width="240" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="150" y="196" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#4A1B0C">Problema de red / acceso</text>
  <text x="150" y="212" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#993C1D">no es un problema de Playwright</text>
</g>

<g>
  <rect x="430" y="178" width="240" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="550" y="196" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">Revisar page snapshot</text>
  <text x="550" y="212" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">show-report / --debug</text>
</g>

<line x1="550" y1="224" x2="550" y2="252" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="400" y="254" width="300" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="550" y="272" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">¿La pantalla y el texto coinciden</text>
  <text x="550" y="288" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">exactamente con lo esperado?</text>
</g>

<line x1="470" y1="306" x2="330" y2="330" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">No</text>

<line x1="630" y1="306" x2="670" y2="330" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="140" y="332" width="300" height="26" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="290" y="345" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#2C2C2A">Causa raíz: idioma, entorno o estado distinto (no el locator)</text>
</g>

<g>
  <rect x="450" y="332" width="220" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="560" y="345" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#4A1B0C">Recién ahí, revisar el locator</text>
</g>

</svg>

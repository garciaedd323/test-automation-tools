<svg width="680" height="274" viewBox="0 0 680 274" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Auto-waiting en acciones vs web-first assertions en Playwright</title>
<desc>Diagrama que compara las acciones como click(), que verifican un checklist de 6 condiciones antes de actuar, contra expect(), que reintenta en un ciclo hasta cumplir la condición o agotar el timeout, y cómo ambos caminos continúan hacia el resto del test.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="274" fill="#ffffff"/>

<path d="M600,70 Q510,22 420,70" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="510" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">reintenta hasta cumplir</text>

<line x1="170" y1="126" x2="330" y2="208" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510" y1="126" x2="350" y2="208" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="60" y="70" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="170" y="88" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Acciones: .click() .fill()</text>
  <text x="170" y="106" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Checklist de 6 condiciones</text>
</g>

<g>
  <rect x="400" y="70" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="510" y="88" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">expect()</text>
  <text x="510" y="106" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Reintenta hasta cumplir</text>
</g>

<g>
  <rect x="230" y="210" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="232" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Continúa el test</text>
</g>
</svg>

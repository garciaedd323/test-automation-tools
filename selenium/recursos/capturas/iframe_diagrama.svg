<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="380" fill="#f5f6f8"/>

  <!-- Página principal -->
  <rect x="40" y="30" width="820" height="320" rx="8" fill="#ffffff" stroke="#c9ccd1" stroke-width="2"/>
  <rect x="40" y="30" width="820" height="34" rx="8" fill="#e2e5ea"/>
  <circle cx="810" cy="47" r="4" fill="#e05d5d"/>
  <circle cx="795" cy="47" r="4" fill="#e8b84b"/>
  <circle cx="780" cy="47" r="4" fill="#4caf6b"/>
  <text x="58" y="52" font-size="12" fill="#333">tienda-ejemplo.com/checkout</text>

  <text x="70" y="100" font-size="14" font-weight="bold" fill="#222">Página principal (contexto por defecto)</text>

  <rect x="70" y="115" width="300" height="40" rx="6" fill="#f0f4fa" stroke="#dbe2ea"/>
  <text x="85" y="140" font-size="12" fill="#444">Resumen del pedido: $49.900</text>

  <!-- botón confirmar pago, fuera del iframe -->
  <rect x="70" y="280" width="180" height="40" rx="6" fill="#f5f0e8" stroke="#e0d0b0"/>
  <text x="90" y="305" font-size="12" fill="#5a4a2a" font-weight="bold">Botón "Confirmar pago"</text>
  <text x="70" y="335" font-size="11" fill="#999">(vive en la página principal, no en el iframe)</text>

  <!-- iframe (caja fuerte) -->
  <g>
    <rect x="420" y="115" width="410" height="200" rx="8" fill="#fffef0" stroke="#e8b84b" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="435" y="140" font-size="12" font-weight="bold" fill="#8a6d1a">&lt;iframe class="stripe-frame"&gt;</text>
    <text x="435" y="158" font-size="11" fill="#8a6d1a" font-style="italic">🔒 "caja fuerte" — contexto independiente</text>

    <rect x="435" y="175" width="380" height="120" rx="6" fill="#ffffff" stroke="#e8d9a0"/>
    <text x="450" y="200" font-size="12" fill="#444">Número de tarjeta:</text>
    <rect x="450" y="210" width="220" height="26" rx="4" fill="#fafafa" stroke="#ccc"/>
    <text x="460" y="228" font-size="11" fill="#888">4242 4242 4242 4242</text>

    <text x="450" y="260" font-size="12" fill="#444">CVV:</text>
    <rect x="450" y="268" width="70" height="26" rx="4" fill="#fafafa" stroke="#ccc"/>
    <text x="460" y="286" font-size="11" fill="#888">123</text>
  </g>

  <!-- flecha de switchTo -->
  <g>
    <line x1="330" y1="215" x2="415" y2="215" stroke="#e8b84b" stroke-width="3" marker-end="url(#arrow2)"/>
    <text x="330" y="200" font-size="11" fill="#8a6d1a" font-weight="bold">switchTo().frame(...)</text>
  </g>

  <!-- flecha de salida -->
  <g>
    <line x1="420" y1="330" x2="260" y2="330" stroke="#4a90d9" stroke-width="3" marker-end="url(#arrow3)"/>
    <text x="330" y="350" font-size="11" fill="#4a90d9" font-weight="bold">switchTo().defaultContent()</text>
  </g>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e8b84b"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a90d9"/>
    </marker>
  </defs>

  <text x="40" y="365" font-size="12" fill="#999" font-style="italic">
    Diagrama ilustrativo — no es una captura real de un sitio web.
  </text>
</svg>

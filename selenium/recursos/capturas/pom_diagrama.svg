<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Page Object Model: el test solo conoce los Page Objects</title>
<desc>Diagrama que muestra cómo el test solo interactúa con LoginPage y DashboardPage, sin conocer los locators directamente, y cómo clickIngresar() en LoginPage retorna un DashboardPage, modelando la navegación real entre páginas.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="260" fill="#ffffff"/>

<line x1="150" y1="96" x2="150" y2="124" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="270" y1="150" x2="398" y2="150" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="50" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="150" y="58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Test</text>
  <text x="150" y="76" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Solo llama métodos públicos</text>
</g>

<g>
  <rect x="50" y="126" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="160" y="144" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">LoginPage</text>
  <text x="160" y="162" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">clickIngresar() retorna...</text>
</g>

<g>
  <rect x="400" y="126" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="510" y="144" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">DashboardPage</text>
  <text x="510" y="162" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">La siguiente página</text>
</g>

<text x="340" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Los locators viven escondidos dentro de cada Page Object, nunca en el test</text>
</svg>

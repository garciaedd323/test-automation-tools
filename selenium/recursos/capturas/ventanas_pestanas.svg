<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="380" fill="#f5f6f8"/>

  <!-- Ventana principal -->
  <g>
    <rect x="30" y="40" width="380" height="280" rx="8" fill="#ffffff" stroke="#c9ccd1" stroke-width="2"/>
    <!-- barra de pestañas -->
    <rect x="30" y="40" width="380" height="34" rx="8" fill="#e2e5ea"/>
    <rect x="42" y="46" width="150" height="24" rx="6" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="60" y="63" font-size="12" fill="#333">Pestaña principal</text>
    <circle cx="380" cy="50" r="4" fill="#e05d5d"/>
    <circle cx="365" cy="50" r="4" fill="#e8b84b"/>
    <circle cx="350" cy="50" r="4" fill="#4caf6b"/>

    <text x="55" y="110" font-size="14" font-weight="bold" fill="#222">Handle: "A1B2C3"</text>
    <text x="55" y="140" font-size="12" fill="#555">Habitación 101</text>
    <rect x="50" y="160" width="330" height="120" rx="6" fill="#f0f4fa" stroke="#dbe2ea"/>
    <text x="65" y="185" font-size="12" fill="#444">&lt;a href="terminos.html"</text>
    <text x="65" y="203" font-size="12" fill="#444">   target="_blank"&gt;</text>
    <text x="65" y="221" font-size="12" fill="#444">Ver términos y condiciones</text>
    <text x="65" y="239" font-size="12" fill="#444">&lt;/a&gt;</text>

    <text x="55" y="305" font-size="11" fill="#888">driver.getWindowHandle() → "A1B2C3"</text>
  </g>

  <!-- Flecha de cambio de contexto -->
  <g>
    <line x1="420" y1="180" x2="480" y2="180" stroke="#4a90d9" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="410" y="160" font-size="12" fill="#4a90d9" font-weight="bold">switchTo()</text>
    <text x="410" y="205" font-size="12" fill="#4a90d9" font-weight="bold">.window(handle)</text>
  </g>

  <!-- Ventana nueva -->
  <g>
    <rect x="490" y="40" width="380" height="280" rx="8" fill="#ffffff" stroke="#4a90d9" stroke-width="3"/>
    <rect x="490" y="40" width="380" height="34" rx="8" fill="#dceafc"/>
    <rect x="502" y="46" width="180" height="24" rx="6" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
    <text x="520" y="63" font-size="12" fill="#333">Términos y condiciones</text>
    <circle cx="840" cy="50" r="4" fill="#e05d5d"/>
    <circle cx="825" cy="50" r="4" fill="#e8b84b"/>
    <circle cx="810" cy="50" r="4" fill="#4caf6b"/>

    <text x="515" y="110" font-size="14" font-weight="bold" fill="#222">Handle: "D4E5F6"</text>
    <text x="515" y="140" font-size="12" fill="#555">Habitación 102 (nueva)</text>
    <rect x="510" y="160" width="330" height="120" rx="6" fill="#eef6ee" stroke="#cfe6cf"/>
    <text x="525" y="185" font-size="12" fill="#2c662d" font-weight="bold">✓ Ahora Selenium SÍ puede</text>
    <text x="525" y="203" font-size="12" fill="#2c662d" font-weight="bold">   ver e interactuar aquí</text>
    <text x="525" y="230" font-size="11" fill="#555">driver.findElement(</text>
    <text x="525" y="246" font-size="11" fill="#555">  By.id("titulo-terminos"))</text>

    <text x="515" y="305" font-size="11" fill="#888">Contexto activo tras el switch</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a90d9"/>
    </marker>
  </defs>

  <text x="30" y="360" font-size="12" fill="#999" font-style="italic">
    Diagrama ilustrativo — no es una captura real de un sitio web.
  </text>
</svg>

<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Flujo de trabajo con Appium Inspector</title>
<desc>Diagrama que muestra cómo Appium Inspector se conecta al Appium Server con las mismas capabilities de un test real, muestra el árbol de elementos de la app, permite elegir el atributo más estable como locator, y finalmente genera el código listo para usar en el test.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#ffffff"/>

<line x1="140" y1="68" x2="140" y2="106" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="140" y1="162" x2="140" y2="200" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="140" y1="256" x2="140" y2="294" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="140" y1="350" x2="140" y2="386" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="40" y="26" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="140" y="44" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Appium Server</text>
  <text x="140" y="62" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Corriendo en local</text>
</g>
<text x="260" y="82" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Mismas capabilities de un test real</text>

<g>
  <rect x="40" y="120" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="140" y="138" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Appium Inspector</text>
  <text x="140" y="156" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Captura + árbol de elementos</text>
</g>
<text x="260" y="176" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Clic en un elemento de la pantalla</text>

<g>
  <rect x="40" y="214" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="140" y="232" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">Elegir atributo estable</text>
  <text x="140" y="250" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">resource-id / accessibility id</text>
</g>
<text x="260" y="270" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Se descarta bounds y XPath</text>

<g>
  <rect x="40" y="308" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="140" y="326" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">Código generado</text>
  <text x="140" y="344" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Java / Python / JS listo</text>
</g>

<g>
  <rect x="40" y="388" width="200" height="30" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="140" y="403" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#412402">Se copia al test real</text>
</g>
</svg>

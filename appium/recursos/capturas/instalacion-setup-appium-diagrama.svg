<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Instalación y setup del entorno de Appium</title>
<desc>Diagrama que muestra Node.js y Appium Server como base común del entorno, ramificándose hacia el kit de Android (SDK, ANDROID_HOME, UiAutomator2) y el kit de iOS (Xcode, XCUITest), cada uno terminando en un emulador o simulador, o en un dispositivo físico, y confluyendo en appium-doctor como verificación final.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="500" fill="#ffffff"/>

<line x1="340" y1="76" x2="340" y2="134" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="190" x2="200" y2="248" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="190" x2="480" y2="248" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200" y1="304" x2="200" y2="360" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480" y1="304" x2="480" y2="360" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200" y1="418" x2="300" y2="450" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480" y1="418" x2="380" y2="450" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="240" y="20" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Node.js</text>
  <text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Motor base</text>
</g>

<g>
  <rect x="240" y="136" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Appium Server</text>
  <text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">npm install -g appium</text>
</g>

<g>
  <rect x="100" y="250" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="200" y="268" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">Kit Android</text>
  <text x="200" y="286" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">SDK, ANDROID_HOME, UiAutomator2</text>
</g>

<g>
  <rect x="380" y="250" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="480" y="268" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Kit iOS</text>
  <text x="480" y="286" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Xcode, XCUITest (solo macOS)</text>
</g>

<g>
  <rect x="100" y="362" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="200" y="380" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">Emulador / dispositivo</text>
  <text x="200" y="398" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">AVD o físico por USB</text>
</g>

<g>
  <rect x="380" y="362" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="480" y="380" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">Simulador / dispositivo</text>
  <text x="480" y="398" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Xcode o físico firmado</text>
</g>

<g>
  <rect x="240" y="440" width="200" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="462" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#412402">appium-doctor</text>
</g>
</svg>

<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Gestos táctiles en Appium, ordenados por complejidad</title>
<desc>Diagrama que ordena los gestos táctiles de Appium de menor a mayor complejidad: tap simple, swipe/scroll, long press, y pinch/zoom con dos dedos coordinados.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="340" fill="#ffffff"/>

<line x1="252" y1="48" x2="316" y2="48" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="416" y1="132" x2="416" y2="150" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="316" y1="200" x2="252" y2="256" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="52" y="20" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="152" y="38" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Tap simple</text>
  <text x="152" y="56" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Un dedo, un punto</text>
</g>

<g>
  <rect x="316" y="20" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="416" y="38" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">Swipe / Scroll</text>
  <text x="416" y="56" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Un dedo, se mueve</text>
</g>

<g>
  <rect x="316" y="152" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="416" y="170" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Long press</text>
  <text x="416" y="188" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Un dedo, se detiene</text>
</g>

<g>
  <rect x="52" y="228" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="152" y="246" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">Pinch / Zoom</text>
  <text x="152" y="264" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Dos dedos coordinados</text>
</g>
</svg>

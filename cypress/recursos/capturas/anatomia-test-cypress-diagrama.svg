<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Anatomía de un test en Cypress</title>
<desc>Diagrama que muestra la jerarquía de un test de Cypress: un describe que agrupa todo, un before que corre una sola vez al inicio, un bloque que se repite por cada it con beforeEach, el it, y afterEach, y finalmente un after que corre una sola vez al final.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="480" fill="#ffffff"/>

<line x1="340" y1="66" x2="340" y2="94" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="150" x2="340" y2="178" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="380" x2="340" y2="408" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="234" x2="340" y2="262" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="318" x2="340" y2="346" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="240" y="10" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="28" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">describe(...)</text>
  <text x="340" y="46" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Agrupa todo el bloque</text>
</g>

<g>
  <rect x="240" y="96" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="114" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">before()</text>
  <text x="340" y="132" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Se ejecuta una sola vez</text>
</g>

<rect x="150" y="178" width="380" height="220" rx="12" fill="none" stroke="#9c9a94" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Se repite por cada it()</text>

<g>
  <rect x="240" y="206" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="224" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">beforeEach()</text>
  <text x="340" y="242" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Antes de cada it</text>
</g>

<g>
  <rect x="240" y="290" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">it(...)</text>
  <text x="340" y="326" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">El test en sí, usa cy</text>
</g>

<g>
  <rect x="240" y="360" width="200" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="375" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#0C447C">afterEach()</text>
</g>

<g>
  <rect x="240" y="410" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="428" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">after()</text>
  <text x="340" y="446" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Se ejecuta una sola vez</text>
</g>
</svg>

<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitectura de Cypress comparada con Selenium/Appium</title>
<desc>Diagrama que compara la arquitectura remota de Selenium y Appium, donde el cliente de test habla por HTTP con un servidor intermediario antes de llegar al navegador o la app, contra la arquitectura de Cypress, que vive directamente dentro del navegador junto con un proceso de Node.js que lo coordina, sin ningún viaje de red de por medio.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="330" fill="#ffffff"/>

<text x="150" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5F5E5A">Selenium / Appium</text>
<text x="530" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5F5E5A">Cypress</text>

<line x1="150" y1="72" x2="150" y2="110" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="150" y1="166" x2="150" y2="204" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="50" y="38" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="150" y="56" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Cliente de test</text>
  <text x="150" y="74" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Fuera del navegador</text>
</g>

<g>
  <rect x="50" y="132" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="150" y="150" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">WebDriver / Appium Server</text>
  <text x="150" y="168" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Traduce por HTTP</text>
</g>

<g>
  <rect x="50" y="226" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="150" y="244" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">Navegador / App</text>
  <text x="150" y="262" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Recibe la orden a distancia</text>
</g>

<rect x="420" y="86" width="220" height="216" rx="12" fill="none" stroke="#9c9a94" stroke-width="1" stroke-dasharray="4 4"/>
<text x="530" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Mismo proceso, sin HTTP</text>

<g>
  <rect x="440" y="106" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="530" y="124" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">Navegador + Cypress</text>
  <text x="530" y="142" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Acceso directo al DOM</text>
</g>

<line x1="515" y1="162" x2="515" y2="220" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="545" y1="220" x2="545" y2="162" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="440" y="220" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="530" y="238" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Proceso Node.js</text>
  <text x="530" y="256" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Coordina detrás de bambalinas</text>
</g>
</svg>
